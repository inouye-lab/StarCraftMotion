name: starcraft
channels:
  - defaults
  - conda-forge
dependencies:
  # pysc2 3.0 was tested against Python 3.7. Newer Python versions may work but
  # are not guaranteed; pin to 3.7 to match the published dataset extraction.
  - python=3.7
  - numpy
  - scipy>=1.4
  - pandas=1.3
  - joblib=0.13
  - tqdm>=4.6
  - pip>=21.2
  - pip:
    - protobuf==3.19      # required by s2clientprotocol
    - pysc2==3.0          # SC2 engine bindings (Stage 1 only)
    - h5py                # HDF5 output for all stages
    - absl-py             # CLI flags used by extract_replay_level.py
